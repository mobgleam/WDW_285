<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>
<h2>Unordered lists</h2>
<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JAVASCRIPT</li>
</ul>

<h2>Ordered lists</h2>
<ol>
    <li>wake up</li>
    <li>study</li>
    <li>practice</li>

</ol>

<h2>Description lists</h2>
<dl>
    <dt>HTML</dt>
    <dd>Hypertext Markup Language</dd>
    <dt>CSS</dt>
    <dd>Cascading Style Sheet</dd>
</dl>
</body>





</html>
