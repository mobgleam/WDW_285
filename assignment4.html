<!DOCTYPE html>
<html>
<head>
    <title>Semantic Elements</title>
</head>
<body>

    <!-- Semantic Elements -->

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8oeQJ4_wGzkTAycajLyqan2oiFeaVqMqTNQI5QBe0ww&s=10">Home</a>  
    </nav>
    <main>
        <section>
            <h2>About HTML</h2>
            <p>HTML is used to create webpages.</p>
        </section>

        <article>
            <h2>HTML Article</h2>
            <p>HTML is easy to learn.</p>
        </article>

        <aside>Related Information</aside>
    </main>

    <footer>
        <p>Copyright 2026</p>
    </footer>
     <!-- Non-Semantic Elements -->

    <div>This is a div element.</div>
    <span>This is a span element.</span>

</body>
</html>
